<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coming Soon — Vishal Dhangare</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a26;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.14);
    --text: #f0f0f8;
    --muted: rgba(240,240,248,0.45);
    --accent: #7c6af5;
    --accent2: #b98af7;
    --accent3: #5ec4f5;
    --gold: #f5c842;
    --glow: rgba(124,106,245,0.18);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
  }

  /* ── Canvas ── */
  #canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  /* ── Layout ── */
  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    gap: 0;
  }

  /* ── Glass card ── */
  .card {
    background: rgba(18,18,26,0.72);
    border: 1px solid var(--border2);
    border-radius: 28px;
    padding: 60px 56px 52px;
    max-width: 620px;
    width: 100%;
    text-align: center;
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04),
      0 40px 80px rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255,255,255,0.09);
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: -1px; left: 50%; transform: translateX(-50%);
    width: 60%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
    opacity: 0.9;
  }

  /* ── Top label ── */
  .label-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 36px;
  }

  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 2.2s ease-in-out infinite;
  }

  .label-text {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent2);
  }

  /* ── Name ── */
  .name {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(36px, 6vw, 58px);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #f0f0f8 30%, var(--accent2) 70%, var(--accent3) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
  }

  .name em {
    font-style: italic;
    font-weight: 400;
  }

  /* ── Tagline ── */
  .tagline {
    font-size: 15px;
    font-weight: 400;
    color: var(--muted);
    line-height: 1.65;
    max-width: 400px;
    margin: 0 auto 44px;
  }

  /* ── Divider ── */
  .divider {
    width: 48px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    margin: 0 auto 40px;
  }

  /* ── Countdown ── */
  .countdown {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-bottom: 44px;
  }

  .count-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .count-num {
    width: 72px; height: 72px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    letter-spacing: -0.02em;
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s;
  }

  .count-num::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.04) 0%, transparent 100%);
    pointer-events: none;
  }

  .count-num.tick {
    border-color: var(--accent);
  }

  .count-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ── Notify form ── */
  .notify-row {
    display: flex;
    gap: 10px;
    max-width: 380px;
    margin: 0 auto 44px;
  }

  .notify-input {
    flex: 1;
    height: 46px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 12px;
    padding: 0 16px;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .notify-input::placeholder { color: rgba(240,240,248,0.3); }

  .notify-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124,106,245,0.18);
  }

  .notify-btn {
    height: 46px;
    padding: 0 22px;
    background: var(--accent);
    border: none;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
    box-shadow: 0 4px 20px rgba(124,106,245,0.4);
  }

  .notify-btn:hover {
    background: #8f7ef8;
    box-shadow: 0 6px 28px rgba(124,106,245,0.55);
  }

  .notify-btn:active { transform: scale(0.97); }

  .notify-success {
    display: none;
    font-size: 13px;
    color: #5ec4a8;
    font-weight: 500;
    margin-top: -34px;
    margin-bottom: 44px;
  }

  /* ── Social row ── */
  .social-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
  }

  .social-link {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    text-decoration: none;
    transition: background 0.2s, border-color 0.2s, transform 0.15s;
    color: var(--muted);
    font-size: 15px;
  }

  .social-link:hover {
    background: rgba(124,106,245,0.15);
    border-color: var(--accent);
    color: var(--accent2);
    transform: translateY(-2px);
  }

  /* ── Bottom signature ── */
  .signature {
    margin-top: 40px;
    font-size: 12px;
    color: rgba(240,240,248,0.25);
    letter-spacing: 0.04em;
  }

  /* ── Animations ── */
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0);    }
  }

  .card > * {
    animation: fadeUp 0.7s ease both;
  }
  .label-row   { animation-delay: 0.1s; }
  .name        { animation-delay: 0.2s; }
  .tagline     { animation-delay: 0.3s; }
  .divider     { animation-delay: 0.35s; }
  .countdown   { animation-delay: 0.4s; }
  .notify-row  { animation-delay: 0.5s; }
  .notify-success { animation-delay: 0.5s; }
  .social-row  { animation-delay: 0.6s; }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<main class="page">
  <div class="card">

    <div class="label-row">
      <span class="dot"></span>
      <span class="label-text">Something big is coming</span>
      <span class="dot"></span>
    </div>

    <h1 class="name">Vishal<br><em>Dhangare</em></h1>

    <p class="tagline">
      A new experience is being crafted.<br>
      Great things take time — and this will be worth the wait.
    </p>

    <div class="divider"></div>

    <div class="countdown" id="countdown">
      <div class="count-block">
        <div class="count-num" id="cd-days">00</div>
        <div class="count-label">Days</div>
      </div>
      <div class="count-block">
        <div class="count-num" id="cd-hours">00</div>
        <div class="count-label">Hours</div>
      </div>
      <div class="count-block">
        <div class="count-num" id="cd-mins">00</div>
        <div class="count-label">Mins</div>
      </div>
      <div class="count-block">
        <div class="count-num" id="cd-secs">00</div>
        <div class="count-label">Secs</div>
      </div>
    </div>

    <div class="notify-row" id="notify-form">
      <input class="notify-input" type="email" id="email-input" placeholder="Enter your email…" />
      <button class="notify-btn" id="notify-btn">Notify me</button>
    </div>
    <div class="notify-success" id="notify-success">
      ✦ &nbsp;You're on the list! We'll reach out soon.
    </div>

    <div class="social-row">
      <a class="social-link" href="#" title="Twitter / X" aria-label="Twitter">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.741l7.73-8.835L1.254 2.25H8.08l4.258 5.63 5.906-5.63Zm-1.161 17.52h1.833L7.084 4.126H5.117Z"/></svg>
      </a>
      <a class="social-link" href="#" title="LinkedIn" aria-label="LinkedIn">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
      </a>
      <a class="social-link" href="#" title="GitHub" aria-label="GitHub">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
      </a>
      <a class="social-link" href="#" title="Instagram" aria-label="Instagram">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
      </a>
    </div>

  </div>

  <p class="signature">© 2025 Vishal Dhangare &nbsp;·&nbsp; All rights reserved</p>
</main>

<script>
(function() {
  /* ── Particle canvas ── */
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  window.addEventListener('resize', resize);
  resize();

  class Particle {
    constructor() { this.reset(true); }
    reset(init) {
      this.x = Math.random() * W;
      this.y = init ? Math.random() * H : H + 10;
      this.r = Math.random() * 1.2 + 0.3;
      this.speed = Math.random() * 0.4 + 0.1;
      this.drift = (Math.random() - 0.5) * 0.3;
      this.alpha = Math.random() * 0.55 + 0.1;
      this.hue = Math.random() < 0.4
        ? `hsla(${250 + Math.random()*30},80%,75%,${this.alpha})`
        : `hsla(200,70%,80%,${this.alpha * 0.6})`;
    }
    update() {
      this.y -= this.speed;
      this.x += this.drift;
      if (this.y < -10) this.reset(false);
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      ctx.fillStyle = this.hue;
      ctx.fill();
    }
  }

  for (let i = 0; i < 110; i++) particles.push(new Particle());

  /* Subtle radial glow */
  function drawGlow() {
    const grd = ctx.createRadialGradient(W/2, H*0.46, 40, W/2, H*0.46, W*0.52);
    grd.addColorStop(0, 'rgba(124,106,245,0.09)');
    grd.addColorStop(0.5, 'rgba(94,196,245,0.04)');
    grd.addColorStop(1, 'transparent');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);
  }

  function loop() {
    ctx.clearRect(0, 0, W, H);
    drawGlow();
    particles.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(loop);
  }
  loop();

  /* ── Countdown ── */
  const target = new Date();
  target.setDate(target.getDate() + 47);
  target.setHours(0, 0, 0, 0);

  const els = {
    d: document.getElementById('cd-days'),
    h: document.getElementById('cd-hours'),
    m: document.getElementById('cd-mins'),
    s: document.getElementById('cd-secs'),
  };

  function pad(n) { return String(n).padStart(2, '0'); }

  function flashTick(el) {
    el.classList.add('tick');
    setTimeout(() => el.classList.remove('tick'), 300);
  }

  let prev = {};
  function tick() {
    const now = Date.now();
    const diff = Math.max(0, target - now);
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);

    if (prev.s !== s) { els.s.textContent = pad(s); flashTick(els.s); }
    if (prev.m !== m) { els.m.textContent = pad(m); flashTick(els.m); }
    if (prev.h !== h) { els.h.textContent = pad(h); flashTick(els.h); }
    if (prev.d !== d) { els.d.textContent = pad(d); flashTick(els.d); }
    prev = { d, h, m, s };
  }
  tick();
  setInterval(tick, 1000);

  /* ── Notify form ── */
  document.getElementById('notify-btn').addEventListener('click', function() {
    const val = document.getElementById('email-input').value.trim();
    if (!val || !val.includes('@')) {
      document.getElementById('email-input').focus();
      document.getElementById('email-input').style.borderColor = '#f56565';
      setTimeout(() => document.getElementById('email-input').style.borderColor = '', 1200);
      return;
    }
    document.getElementById('notify-form').style.display = 'none';
    const success = document.getElementById('notify-success');
    success.style.display = 'block';
    success.style.animation = 'fadeUp 0.5s ease both';
  });

  document.getElementById('email-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('notify-btn').click();
  });
})();
</script>
</body>
</html>
