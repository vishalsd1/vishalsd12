<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon | Vishal SD</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#0f172a,#1e293b);
      color:white;
      text-align:center;
      overflow:hidden;
    }

    .container{
      padding:40px;
      max-width:600px;
    }

    h1{
      font-size:70px;
      margin-bottom:20px;
      letter-spacing:2px;
    }

    p{
      font-size:20px;
      color:#cbd5e1;
      margin-bottom:30px;
      line-height:1.6;
    }

    .badge{
      display:inline-block;
      padding:12px 24px;
      background:#ffffff15;
      border:1px solid #ffffff30;
      border-radius:50px;
      backdrop-filter:blur(10px);
      font-size:14px;
      letter-spacing:1px;
    }

    .glow{
      position:absolute;
      width:300px;
      height:300px;
      background:#3b82f6;
      filter:blur(120px);
      opacity:0.25;
      z-index:-1;
    }

    .glow.one{
      top:-100px;
      left:-100px;
    }

    .glow.two{
      bottom:-100px;
      right:-100px;
      background:#ec4899;
    }

    @media(max-width:600px){
      h1{
        font-size:48px;
      }

      p{
        font-size:16px;
      }
    }
  </style>
</head>

<body>

  <div class="glow one"></div>
  <div class="glow two"></div>

  <div class="container">
    <h1>Coming Soon</h1>

    <p>
      Our new website is under development.<br>
      Stay tuned for something amazing.
    </p>

    <div class="badge">
      vishalsd.site
    </div>

  <div class="container">...........IN PROGRESS</div>
    <div class="badge">Stay Tuned</div>
  </div>

</body>
</html>
